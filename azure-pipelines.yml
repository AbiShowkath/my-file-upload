trigger:
  - azure-entra-id

variables:
  namePrefix: 'fileupload'
  vmImageName: 'ubuntu-latest'

  # system.debug: true

  # Azure Resource Variables
  resourceGroupName: $(namePrefix)RG
  appName: $(namePrefix)app
  location: 'eastus'

  # Bicep files
  deploymentName: 'main'
  templateFile: 'bicep/$(deploymentName).bicep'

  containerDeploymentName: 'container'
  containerTemplateFile: 'bicep/$(containerDeploymentName).bicep'

pool:
  vmImage: $(vmImageName)

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

stages:
- stage: Dev
  displayName: 'Dev Deployment'
  jobs:
  - job: InfrastructureDeployment
    displayName: 'Deploy main Bicep Template to Azure'
    variables:
    - group: fileupload
    steps:
      - task: AzureResourceManagerTemplateDeployment@3
        displayName: 'Deploy Main Bicep Template'
        inputs:
          deploymentScope: 'Resource Group'
          action: 'Create Or Update Resource Group'
          resourceGroupName: '$(resourceGroupName)'
          location: '$(location)'
          templateLocation: 'Linked artifact'
          csmFile: '$(templateFile)'
          overrideParameters: '-namePrefix $(namePrefix)app -appId $(appId) -tenantId $(tenantId)'
          deploymentMode: 'Incremental'
          deploymentName: '$(deploymentName)'
          connectedServiceName: '${{ parameters.serviceConnection }}'
      
      - task: Docker@2
        displayName: 'Build backend Docker image'
        inputs:
          command: 'build'
          Dockerfile: './py-file-upload/Dockerfile'
          repository: '$(namePrefix)-api'
          tags: |
            $(Build.BuildId)    
      
      - task: AzureCLI@2
        displayName: 'Login to ACR'
        name: GetOutputs
        inputs:
          azureSubscription: '${{ parameters.serviceConnection }}'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            acrNameOutput=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.acrName.value -o tsv)
            echo "ACR Name: $acrNameOutput"
            echo "##vso[task.setvariable variable=acrName;isOutput=true]$acrNameOutput"
            kvNameOutput=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.kvName.value -o tsv)
            echo "Key Vault Name: $kvNameOutput"
            echo "##vso[task.setvariable variable=kvName;isOutput=true]$kvNameOutput"
            saNameOutput=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.saName.value -o tsv)
            echo "Storage Account Name: $saNameOutput"
            echo "##vso[task.setvariable variable=saName;isOutput=true]$saNameOutput"
            acrLoginServer="$acrNameOutput.azurecr.io"
            az acr login -n $acrNameOutput
            docker tag $(namePrefix)-api:$(Build.BuildId) $acrLoginServer/$(namePrefix)-api:latest
            docker push $acrLoginServer/$(namePrefix)-api:latest

  - job: ContainerDeployment
    displayName: 'Deploy Container Bicep Template to Azure'
    dependsOn: InfrastructureDeployment
    variables:
    - group: fileupload
    - name : acrName
      value: $[dependencies.InfrastructureDeployment.outputs['GetOutputs.acrName']]
    - name : kvName
      value: $[dependencies.InfrastructureDeployment.outputs['GetOutputs.kvName']]
    - name : saName
      value: $[dependencies.InfrastructureDeployment.outputs['GetOutputs.saName']]
    steps:
      - task: AzureResourceManagerTemplateDeployment@3
        displayName: 'Deploy Container Bicep Template'
        inputs:
          deploymentScope: 'Resource Group'
          action: 'Create Or Update Resource Group'
          resourceGroupName: '$(resourceGroupName)'
          location: '$(location)'
          templateLocation: 'Linked artifact'
          csmFile: '$(containerTemplateFile)'
          overrideParameters: '-namePrefix $(namePrefix) -acrName $(acrName) -kvName $(kvName) -saName $(saName) -appId $(appId) -tenantId $(tenantId) -password $(password)'
          deploymentMode: 'Incremental'
          deploymentName: '$(containerDeploymentName)'
          connectedServiceName: '${{ parameters.serviceConnection }}'