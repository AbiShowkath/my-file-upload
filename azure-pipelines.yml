trigger:
  - azure-entra-id

variables:
  namePrefix: 'fileupload'
  vmImageName: 'ubuntu-latest'

  # system.debug: true

  # buildConfiguration: 'Release'

  # Azure Resource Variables
  resourceGroupName: $(namePrefix)RG
  appName: $(namePrefix)app
  location: 'eastus'

  # Bicep files
  deploymentName: 'main'
  templateFile: 'bicep/$(deploymentName).bicep'

  containerDeploymentName: 'container'
  containerTemplateFile: 'bicep/$(containerDeploymentName).bicep'

pool:
  vmImage: $(vmImageName)

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

stages:
- stage: Dev
  displayName: 'Dev Deployment'
  jobs:
  - job: Deployment
    displayName: 'Deploy ACR Bicep Template to Azure'
    variables:
    - group: fileupload
    steps:
      - task: AzureResourceManagerTemplateDeployment@3
        displayName: 'Deploy Main Bicep Template'
        inputs:
          deploymentScope: 'Resource Group'
          action: 'Create Or Update Resource Group'
          resourceGroupName: '$(resourceGroupName)'
          location: '$(location)'
          templateLocation: 'Linked artifact'
          csmFile: '$(templateFile)'
          overrideParameters: '-namePrefix $(namePrefix)app -appId $(appId) -tenantId $(tenantId)'
          deploymentMode: 'Incremental'
          deploymentName: '$(deploymentName)'
          connectedServiceName: '${{ parameters.serviceConnection }}'
      
      - task: Docker@2
        displayName: 'Build backend Docker image'
        inputs:
          command: 'build'
          Dockerfile: './py-file-upload/Dockerfile'
          repository: '$(namePrefix)-api'
          tags: |
            $(Build.BuildId)    
      
      - task: AzureCLI@2
        displayName: 'Login to ACR'
        inputs:
          azureSubscription: '${{ parameters.serviceConnection }}'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            acrName=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.acrName.value -o tsv)
            acrLoginServer=$(acrName).azurecr.io
            az acr login -n $(acrName)
            docker tag $(namePrefix)-api:$(Build.BuildId) $acrLoginServer/$(namePrefix)-api:latest
            docker push $acrLoginServer/$(namePrefix)-api:latest
      
      # - task: AzureResourceManagerTemplateDeployment@3
      #   displayName: 'Deploy Container Bicep Template'
      #   inputs:
      #     deploymentScope: 'Resource Group'
      #     action: 'Create Or Update Resource Group'
      #     resourceGroupName: '$(resourceGroupName)'
      #     location: '$(location)'
      #     templateLocation: 'Linked artifact'
      #     csmFile: '$(containerTemplateFile)'
      #     overrideParameters: '-namePrefix $(namePrefix)app -appId $(appId) -password $(password) -tenantId $(tenantId)'
